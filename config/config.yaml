embedding:
  text_model: BAAI/bge-small-zh-v1.5
  fake: false
asr:
  model: small
  device: auto         # auto=有GPU用GPU(快10倍+),否则CPU
  compute_type: int8
frames:
  max_frames: 40       # 覆盖整段视频(16 会只采到开头几分钟,长视频不够用)
  frame_interval: 5.0
  scene_threshold: 0.45
  decode: grab         # grab=顺序解码(实测快 7 倍) | seek=旧的逐点定位(回退档)
  unit: auto           # auto=字幕类视频按"动作事件单元"落库 | off=旧块布局(零回归)
  probe:               # 视频画像探针(docs/design-frame-units.md 第 0 步)
    enabled: auto
    hz: 5.0            # 像素证据采样率:5Hz≈4s/6.5分钟;10Hz≈15s
    bands: 24
    text_frames: 10    # 文字证据抽帧数
    min_separation: 3.0  # 活跃文字带判据:变化强度 ≥ 最低者 ×N
vision:
  ocr:
    enabled: auto      # auto=人声太少(字幕/无配音)才跑 | on=一律跑(PPT/代码类) | off=不跑
    speech_ratio: 0.3  # auto 判据:人声时长/视频时长 低于此值就跑 OCR
    band: auto         # auto=按探针字幕带裁切(水印命中 85%→0%) | off=全幅
    full_every: 5      # 双通道:每 N 帧补一次全幅 OCR(卖点/参数浮层文字)
  image_embed:
    enabled: auto      # 抽帧时给画面建 Chinese-CLIP 向量(文字搜画面/以图搜图);
                       # auto=装了 cn-clip 且权重就绪才用,缺失自动跳过
links:
  similarity_threshold: 0.62   # 真实库校准值(AI摘要画像 + top3块均值口径)
  max_per_item: 3
bili:
  quality: 64
  cookies_path: D:\Code\MemVault\config\cookies.txt
keep_video: false
data_dir: null
llm:
  backend: api
  base_url: https://api.commandcode.ai/provider/v1
  model: deepseek/deepseek-v4-flash
  classify_confidence: 0.8
  ads_policy: ignore      # 视频/页面里的广告信息:ignore=忽略不写进属性 | mention=单独一条属性
