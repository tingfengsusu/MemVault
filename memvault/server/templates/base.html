<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MemVault{% endblock %}</title>
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
<header>
  <span class="brand">🧠 MemVault</span>
  <nav>
    <a href="/">库</a>
    <a href="/inbox">待整理</a>
    <a href="/categories">分类</a>
    <a href="/sources">订阅</a>
    <a href="/chat">聊天</a>
    <a href="/jobs">任务</a>
    <a href="/settings">设置</a>
  </nav>
  <form action="/search" style="margin-left:auto">
    <input type="search" name="q" placeholder="搜索记忆库…" value="{{ q or '' }}">
    <button>搜索</button>
  </form>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
