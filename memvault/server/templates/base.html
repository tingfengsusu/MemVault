<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MemVault{% endblock %}</title>
<link rel="stylesheet" href="/static/base.css">
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>
{% set path = request.url.path %}
<header>
  <a class="brand" href="/">🧠 MemVault</a>
  <nav>
    <a href="/" class="{{ 'active' if path == '/' or path.startswith('/search') or path.startswith('/items') else '' }}">库</a>
    <a href="/inbox" class="{{ 'active' if path.startswith('/inbox') else '' }}">待整理</a>
    <a href="/categories" class="{{ 'active' if path.startswith('/categories') else '' }}">分类</a>
    <a href="/sources" class="{{ 'active' if path.startswith('/sources') else '' }}">订阅</a>
    <a href="/chat" class="{{ 'active' if path.startswith('/chat') else '' }}">聊天</a>
    <a href="/jobs" class="{{ 'active' if path.startswith('/jobs') else '' }}">任务</a>
    <a href="/settings" class="{{ 'active' if path.startswith('/settings') else '' }}">设置</a>
  </nav>
  <form action="/search">
    <input type="search" name="q" placeholder="搜索记忆库…" value="{{ q or '' }}">
    <button>搜索</button>
  </form>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
